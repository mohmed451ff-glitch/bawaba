<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بوابة المبرمج</title>
<meta name="description" content="منصة المطور والأمن السيبراني - فحص الثغرات، تعلم البرمجة، وأدوات الاختراق الأخلاقي">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg:#070b1a;--card:#101a33;--cyber:#00ff88;--accent:#38bdf8;--border:#1e2d4f;--danger:#ef4444}
body{background:var(--bg);color:#fff;font-family:Tajawal,sans-serif;margin:0;text-align:center}
header{padding:25px 15px}
.btn{display:block;width:90%;max-width:400px;margin:12px auto;padding:14px;border-radius:14px;border:1px solid var(--border);background:var(--card);color:#fff;font-weight:700;font-size:1.1rem;cursor:pointer}
.btn.main{background:var(--cyber);color:#000;box-shadow:0 0 15px rgba(0,255,136,0.4)}
.btn.red{background:var(--danger)}
.tool-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin:20px auto;max-width:500px;text-align:right}
.tool-box h3{color:var(--cyber);margin-bottom:8px}
.tool-box input{width:100%;padding:12px;border-radius:10px;border:2px solid var(--border);background:#020617;color:#fff;margin-top:10px}
.tool-box button{width:100%;margin-top:10px;padding:12px;border-radius:10px;border:none;background:var(--cyber);font-weight:800;cursor:pointer}
.output{margin-top:10px;background:#020617;padding:12px;border-radius:8px;min-height:40px;font-family:monospace}
</style>
</head>
<body>
<header>
<h2>منصة المطور والأمن السيبراني المتطورة - فحص الثغرات، تعلم البرمجة، وأدوات الاختراق الأخلاقي</h2>
<button class="btn main"><i class="fa-solid fa-house"></i> الرئيسية</button>
<button class="btn">الخدمات والأرباح <i class="fa-solid fa-briefcase"></i></button>
<button class="btn">بيئة البرمجة <i class="fa-solid fa-graduation-cap"></i></button>
<button class="btn">الملخصات والتمارين <i class="fa-solid fa-book-open"></i></button>
<button class="btn">الترسانة الأمنية (50) <i class="fa-solid fa-shield-halved"></i></button>
<button class="btn">أوامر Termux (50) <i class="fa-solid fa-mobile"></i></button>
<button class="btn">أوامر Kali Linux (50) <i class="fa-brands fa-linux"></i></button>
<button class="btn red">💀 قم بالاختراق 💀</button>
</header>

<!-- الأدوات الجديدة - هسا بتظهر -->
<div class="tool-box">
<h3><i class="fa-solid fa-link-slash"></i> فاحص الروابط الملغمة</h3>
<input id="linkIn" placeholder="https://...">
<button onclick="checkLink()">افحص الرابط</button>
<div id="linkOut" class="output">النتيجة هنا...</div>
</div>

<div class="tool-box">
<h3><i class="fa-solid fa-key"></i> مولد كلمات السر القوية</h3>
<input id="passIn" placeholder="اكتب باسورد أو اتركه فاضي">
<button onclick="genPass()">توليد + فحص القوة</button>
<div id="passOut" class="output"></div>
</div>

<div class="tool-box" style="border-color:var(--danger)">
<h3 style="color:var(--danger)"><i class="fa-solid fa-database"></i> فحص تسريب الإيميل</h3>
<input id="emailIn" placeholder="email@example.com">
<button onclick="checkLeak()" style="background:var(--danger);color:#fff">افحص هل إيميلك مسرب؟</button>
<div id="leakOut" class="output"></div>
</div>

<script>
function checkLink(){let v=document.getElementById('linkIn').value;let o=document.getElementById('linkOut');if(!v){o.innerHTML="حط رابط";return}let s=0;if(v.includes('login')||v.includes('free')||v.length>60)s++;if(v.match(/^\d+\.\d+/))s+=2;if(!v.startsWith('https'))s++;if(s>=2)o.innerHTML='<span style=color:#ef4444>🚨 رابط مشبوه! لا تدخلو</span>';else o.innerHTML='<span style=color:#00ff88>✅ يبدو سليم مبدئياً</span>'}
function genPass(){let chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%";let p="";for(let i=0;i<16;i++)p+=chars[Math.floor(Math.random()*chars.length)];document.getElementById('passIn').value=p;let o=document.getElementById('passOut');let strength=p.length>=12?"قوية جداً 🔐":"متوسطة";o.innerHTML=`الباسورد: <b>${p}</b><br>القوة: ${strength}`;}
function checkLeak(){let e=document.getElementById('emailIn').value;let o=document.getElementById('leakOut');if(!e){o.innerHTML="حط إيميل";return}if(e.includes('test')||e.includes('admin'))o.innerHTML='<span style=color:#ef4444>💀 مسرب في 3 قواعد بيانات!</span>';else o.innerHTML='<span style=color:#00ff88>✅ غير موجود في التسريبات المحاكية</span><br><small>افحص الحقيقي: haveibeenpwned.com</small>';}
</script>
</body>
</html>
